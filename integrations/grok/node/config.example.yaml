# RLM instance config (flat RLM plugin keys). Copy to config.yaml in your instance dir and fill in.
# Endpoints are BASE urls (NO /v1) - RLM appends /api/generate and /api/embeddings.

reason_model: your-reason-model             # extraction/consolidation (favor quality; local or cloud)
ollama_endpoint_reason: http://YOUR_OLLAMA_HOST:11434
relation_model: your-relation-model         # triple extraction; leave empty to reuse reason_model
ollama_endpoint_relation: http://YOUR_OLLAMA_HOST:11434
embed_model: nomic-embed-text:latest
ollama_endpoint_embed: http://YOUR_OLLAMA_HOST:11434
reason_timeout: 300.0
embed_timeout: 30.0
memory_reason_max_concurrency: 1            # serialize reason/LLM calls into one lane

# --- dream + retention -----------------------------------------------------------------------
# The ingest driver runs per-window consolidation (fast) then ONE dream cycle post-ingest, so the
# temporal dynamics (decay / tier promotion / prune / conflict-detect) fire once per ingest and
# these dials are live. IMPORTANT: if the agent's recall path does NOT reinforce RLM resonance
# (e.g. a read-only projection, as in the grok bridge), set initial_resonance ABOVE
# promotion_resonance_threshold so durable facts can passively promote to the long tier instead of
# decaying out before they ever get there.
initial_resonance: 6
promotion_resonance_threshold: 4
decay_per_cycle: 0.5
forget_after_dormant_cycles: 100
max_long_facts: 5000                        # 0 = unbounded long tier

# --- roadmap layers (LLM-driven; each costs reason-model calls in/after the dream) -----------
gist_before_prune: true
enable_self_model: true
enable_narrative: true                      # one rolling autobiographical paragraph per ingest
narrative_keep: 40
# Narrative is a summarization task -> point it at a small local model to keep the reason lane
# free. Leave both unset to reuse relation_model and its endpoint.
narrative_model: your-relation-model
narrative_endpoint: http://YOUR_OLLAMA_HOST:11434

# Lab-scoped extraction prompt: anti-fabrication grounding + source_quote + an OPEN category rule.
# Retarget the domain sentence to whatever this agent operates on. The category is deliberately
# open-ended (self-evident labels, natural overlap) so a fixed list never excludes a fact by chance.
extraction_prompt: |
  Analyze this dialogue log and extract the NEW, durable facts that are EXPLICITLY supported by
  the log. This agent is an expert operator of its system and lab. Capture operational knowledge:
  configuration and dials and their effects; decisions and the stated reason; host and network
  topology (machines, endpoints, models, paths); evaluation results; failed probes and their root
  causes; and concrete procedures or commands that worked.

  GROUNDING RULES (critical - violating them corrupts memory):
  - Do NOT invent or infer specifics (paths, hostnames, ports, model names, versions, config keys,
    numbers, flags) that are not literally present in the log. If a detail is not in the log, omit it.
  - For EVERY fact, include "source_quote": the shortest snippet copied VERBATIM from the log.
  - If a candidate fact has no exact supporting snippet, DROP it rather than guessing.
  - Do NOT record secrets, API keys, tokens, or passwords as facts; skip them.
  - Do NOT extract chat pleasantries, self-praise, meta-commentary, or raw tool-output dumps.

  For "category", choose a short category that is relevant to the fact, using self-evident,
  plain-language terms (e.g. decision, dial, config, host_topology, model_spec, path_ref,
  procedure, eval_result, training_run, failed_probe, constraint, concept - or another that fits
  better). Natural overlap is fine and expected; never drop, distort, or force a fact merely
  because it does not match a fixed label - the category is a hint for later recall, not a gate
  on what gets remembered.

  Return ONLY a JSON array; each element: {"content": <atomic fact>, "category": <a self-evident category>,
  "source_quote": <verbatim snippet>, "source_ref": <url/id if the snippet carried one, else null>}.
  If nothing durable is supported, return [].
